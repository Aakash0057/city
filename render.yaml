services:
  # Backend API Web Service
  - type: web
    name: citycare-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: citycare-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://citycare-frontend.onrender.com","http://localhost:5173"]'

  # Frontend Static Site
  - type: web
    runtime: static
    name: citycare-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://citycare-backend.onrender.com

databases:
  - name: citycare-db
    plan: free
    region: oregon
    databaseName: citycare
    user: citycare_user